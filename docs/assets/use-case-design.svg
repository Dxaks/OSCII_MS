<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">OSCII_MS Use Case Design</title>
  <desc id="desc">Use case diagram showing admin, student, moderator, backend API, and database interactions.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; ry: 24; }
      .actor { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 18; ry: 18; }
      .usecase { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .title { fill: #0f172a; font: 700 30px Arial, sans-serif; }
      .section { fill: #0f172a; font: 700 22px Arial, sans-serif; }
      .label { fill: #0f172a; font: 600 18px Arial, sans-serif; }
      .small { fill: #334155; font: 400 15px Arial, sans-serif; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <text x="80" y="70" class="title">OSCII_MS Use Case Design</text>
  <text x="80" y="102" class="small">Actors, system responsibilities, and key workflows in the current implementation</text>

  <rect class="frame" x="80" y="150" width="1640" height="980"/>

  <text x="135" y="205" class="section">Actors</text>
  <text x="545" y="205" class="section">Use Cases</text>
  <text x="1335" y="205" class="section">System Services</text>

  <!-- Actors -->
  <rect class="actor" x="120" y="260" width="220" height="100" rx="20" ry="20"/>
  <text x="230" y="297" text-anchor="middle" class="label">Admin</text>
  <text x="230" y="325" text-anchor="middle" class="small">manages the system</text>

  <rect class="actor" x="120" y="450" width="220" height="100" rx="20" ry="20"/>
  <text x="230" y="487" text-anchor="middle" class="label">Student</text>
  <text x="230" y="515" text-anchor="middle" class="small">takes question assessment</text>

  <rect class="actor" x="120" y="640" width="220" height="100" rx="20" ry="20"/>
  <text x="230" y="677" text-anchor="middle" class="label">Moderator / Examiner</text>
  <text x="230" y="705" text-anchor="middle" class="small">runs procedure assessment</text>

  <!-- Use cases column 1 -->
  <ellipse class="usecase" cx="720" cy="250" rx="145" ry="42"/>
  <text x="720" y="256" text-anchor="middle" class="label">Log in as Admin</text>

  <ellipse class="usecase" cx="720" cy="350" rx="145" ry="42"/>
  <text x="720" y="356" text-anchor="middle" class="label">Create / Edit User</text>

  <ellipse class="usecase" cx="720" cy="450" rx="145" ry="42"/>
  <text x="720" y="456" text-anchor="middle" class="label">Create / Edit Station</text>

  <ellipse class="usecase" cx="720" cy="550" rx="145" ry="42"/>
  <text x="720" y="556" text-anchor="middle" class="label">Manage Questions</text>

  <ellipse class="usecase" cx="720" cy="650" rx="145" ry="42"/>
  <text x="720" y="656" text-anchor="middle" class="label">Manage Procedure Items</text>

  <ellipse class="usecase" cx="720" cy="750" rx="145" ry="42"/>
  <text x="720" y="756" text-anchor="middle" class="label">View / Download Results</text>

  <!-- Use cases column 2 -->
  <ellipse class="usecase" cx="1040" cy="250" rx="145" ry="42"/>
  <text x="1040" y="256" text-anchor="middle" class="label">Log in as Student</text>

  <ellipse class="usecase" cx="1040" cy="350" rx="145" ry="42"/>
  <text x="1040" y="356" text-anchor="middle" class="label">Start / Resume Assessment</text>

  <ellipse class="usecase" cx="1040" cy="450" rx="145" ry="42"/>
  <text x="1040" y="456" text-anchor="middle" class="label">Answer Questions</text>

  <ellipse class="usecase" cx="1040" cy="550" rx="145" ry="42"/>
  <text x="1040" y="556" text-anchor="middle" class="label">Submit Question Result</text>

  <ellipse class="usecase" cx="1040" cy="650" rx="145" ry="42"/>
  <text x="1040" y="656" text-anchor="middle" class="label">Log in as Moderator</text>

  <ellipse class="usecase" cx="1040" cy="750" rx="145" ry="42"/>
  <text x="1040" y="756" text-anchor="middle" class="label">Search / Confirm Student</text>

  <ellipse class="usecase" cx="1040" cy="850" rx="145" ry="42"/>
  <text x="1040" y="856" text-anchor="middle" class="label">Score Procedure Items</text>

  <ellipse class="usecase" cx="1040" cy="950" rx="145" ry="42"/>
  <text x="1040" y="956" text-anchor="middle" class="label">Submit Procedure Result</text>

  <ellipse class="usecase" cx="1040" cy="1050" rx="145" ry="42"/>
  <text x="1040" y="1056" text-anchor="middle" class="label">Admin Verification Exit</text>

  <!-- System services -->
  <rect class="actor" x="1360" y="260" width="220" height="100" rx="20" ry="20"/>
  <text x="1470" y="297" text-anchor="middle" class="label">Backend API</text>
  <text x="1470" y="325" text-anchor="middle" class="small">auth + CRUD + CSV</text>

  <rect class="actor" x="1360" y="450" width="220" height="100" rx="20" ry="20"/>
  <text x="1470" y="487" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1470" y="515" text-anchor="middle" class="small">users, stations, results</text>

  <rect class="actor" x="1360" y="640" width="220" height="100" rx="20" ry="20"/>
  <text x="1470" y="677" text-anchor="middle" class="label">Browser Storage</text>
  <text x="1470" y="705" text-anchor="middle" class="small">token + protected session</text>

  <!-- Actor to use case associations -->
  <line class="line" x1="340" y1="310" x2="575" y2="250"/>
  <line class="line" x1="340" y1="310" x2="575" y2="350"/>
  <line class="line" x1="340" y1="310" x2="575" y2="450"/>
  <line class="line" x1="340" y1="310" x2="575" y2="550"/>
  <line class="line" x1="340" y1="310" x2="575" y2="650"/>
  <line class="line" x1="340" y1="310" x2="575" y2="750"/>

  <line class="line" x1="340" y1="500" x2="895" y2="250"/>
  <line class="line" x1="340" y1="500" x2="895" y2="350"/>
  <line class="line" x1="340" y1="500" x2="895" y2="450"/>
  <line class="line" x1="340" y1="500" x2="895" y2="550"/>

  <line class="line" x1="340" y1="690" x2="895" y2="650"/>
  <line class="line" x1="340" y1="690" x2="895" y2="750"/>
  <line class="line" x1="340" y1="690" x2="895" y2="850"/>
  <line class="line" x1="340" y1="690" x2="895" y2="950"/>

  <!-- Use case to system service associations -->
  <line class="dashed" x1="865" y1="250" x2="1360" y2="310"/>
  <line class="dashed" x1="865" y1="350" x2="1360" y2="310"/>
  <line class="dashed" x1="865" y1="450" x2="1360" y2="500"/>
  <line class="dashed" x1="865" y1="550" x2="1360" y2="500"/>
  <line class="dashed" x1="865" y1="650" x2="1360" y2="500"/>
  <line class="dashed" x1="865" y1="750" x2="1360" y2="500"/>
  <line class="dashed" x1="1185" y1="250" x2="1360" y2="690"/>
  <line class="dashed" x1="1185" y1="350" x2="1360" y2="690"/>
  <line class="dashed" x1="1185" y1="450" x2="1360" y2="690"/>
  <line class="dashed" x1="1185" y1="550" x2="1360" y2="690"/>
  <line class="dashed" x1="1185" y1="650" x2="1360" y2="690"/>
  <line class="dashed" x1="1185" y1="850" x2="1360" y2="310"/>
  <line class="dashed" x1="1185" y1="950" x2="1360" y2="310"/>
  <line class="dashed" x1="1185" y1="1050" x2="1360" y2="690"/>

  <!-- Notes -->
  <text x="140" y="870" class="section">Primary workflow notes</text>
  <text x="140" y="910" class="small">• Admin manages users, stations, timers, questions, procedure items, and results.</text>
  <text x="140" y="944" class="small">• Students work only in the question assessment flow.</text>
  <text x="140" y="978" class="small">• Moderators / examiners work only in the procedure scoring flow.</text>
  <text x="140" y="1012" class="small">• The backend persists all records; browser storage keeps the active token and protected session state.</text>
  <text x="140" y="1046" class="small">• CSV import/export is exposed through the admin dashboard and station results screen.</text>
</svg>

