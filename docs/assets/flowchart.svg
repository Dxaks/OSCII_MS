<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title desc">
  <title id="title">OSCII_MS Flowchart</title>
  <desc id="desc">Operational flow from app startup through admin, student, moderator, and protected exit paths.</desc>
  <defs>
    <style>
      .bg { fill: #fbfdff; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.2; rx: 16; ry: 16; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 20px Arial, sans-serif; }
      .small { fill: #334155; font: 400 16px Arial, sans-serif; }
      .line { stroke: #334155; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1600"/>
  <text x="80" y="70" class="title">OSCII_MS Flowchart</text>

  <rect class="box" x="650" y="110" width="500" height="78"/>
  <text x="900" y="157" text-anchor="middle" class="label">App starts</text>

  <rect class="box" x="650" y="235" width="500" height="78"/>
  <text x="900" y="282" text-anchor="middle" class="label">Load frontend bundle</text>

  <rect class="box" x="650" y="360" width="500" height="78"/>
  <text x="900" y="407" text-anchor="middle" class="label">GET /api/bootstrap</text>

  <polygon class="decision" points="900,500 1030,560 900,620 770,560"/>
  <text x="900" y="552" text-anchor="middle" class="label">Backend data?</text>

  <rect class="box" x="250" y="675" width="500" height="86"/>
  <text x="500" y="722" text-anchor="middle" class="label">Hydrate users, stations, results</text>
  <text x="500" y="748" text-anchor="middle" class="small">Apply snapshot to in-memory stores</text>

  <rect class="box" x="1050" y="675" width="500" height="86"/>
  <text x="1300" y="722" text-anchor="middle" class="label">Use empty in-memory state</text>
  <text x="1300" y="748" text-anchor="middle" class="small">Fallback if backend is unavailable</text>

  <rect class="box" x="650" y="805" width="500" height="78"/>
  <text x="900" y="852" text-anchor="middle" class="label">Render home page</text>

  <polygon class="decision" points="900,920 1060,980 900,1040 740,980"/>
  <text x="900" y="974" text-anchor="middle" class="label">User choice</text>

  <rect class="box" x="180" y="1105" width="380" height="82"/>
  <text x="370" y="1152" text-anchor="middle" class="label">Admin login</text>

  <rect class="box" x="720" y="1105" width="360" height="82"/>
  <text x="900" y="1152" text-anchor="middle" class="label">Main menu</text>

  <rect class="box" x="1250" y="1105" width="380" height="82"/>
  <text x="1440" y="1152" text-anchor="middle" class="label">Station login</text>

  <rect class="box" x="180" y="1235" width="380" height="82"/>
  <text x="370" y="1282" text-anchor="middle" class="label">POST /api/auth/login</text>

  <polygon class="decision" points="370,1360 500,1420 370,1480 240,1420"/>
  <text x="370" y="1414" text-anchor="middle" class="label">Admin valid?</text>

  <rect class="box" x="720" y="1235" width="360" height="82"/>
  <text x="900" y="1282" text-anchor="middle" class="label">Select station type</text>

  <rect class="box" x="1250" y="1235" width="380" height="82"/>
  <text x="1440" y="1282" text-anchor="middle" class="label">POST /api/auth/login</text>

  <polygon class="decision" points="1440,1360 1570,1420 1440,1480 1310,1420"/>
  <text x="1440" y="1414" text-anchor="middle" class="label">Role valid?</text>

  <rect class="box" x="720" y="1510" width="360" height="78"/>
  <text x="900" y="1557" text-anchor="middle" class="label">Student question flow</text>

  <rect class="box" x="1250" y="1510" width="380" height="78"/>
  <text x="1440" y="1557" text-anchor="middle" class="label">Moderator procedure flow</text>

  <line class="line" x1="900" y1="188" x2="900" y2="235"/>
  <line class="line" x1="900" y1="313" x2="900" y2="360"/>
  <line class="line" x1="900" y1="438" x2="900" y2="500"/>
  <line class="line" x1="770" y1="560" x2="750" y2="560"/>
  <line class="line" x1="1030" y1="560" x2="1050" y2="560"/>
  <line class="line" x1="500" y1="761" x2="500" y2="805"/>
  <line class="line" x1="1300" y1="761" x2="1300" y2="805"/>
  <line class="line" x1="900" y1="883" x2="900" y2="920"/>
  <line class="line" x1="740" y1="980" x2="560" y2="980"/>
  <line class="line" x1="1060" y1="980" x2="1240" y2="980"/>
  <line class="line" x1="370" y1="1187" x2="370" y2="1235"/>
  <line class="line" x1="900" y1="1187" x2="900" y2="1235"/>
  <line class="line" x1="1440" y1="1187" x2="1440" y2="1235"/>
  <line class="line" x1="370" y1="1317" x2="370" y2="1360"/>
  <line class="line" x1="1440" y1="1317" x2="1440" y2="1360"/>
  <line class="line" x1="500" y1="1420" x2="650" y2="1420"/>
  <line class="line" x1="1570" y1="1420" x2="1680" y2="1420"/>

  <rect class="box" x="80" y="1530" width="480" height="48"/>
  <text x="320" y="1561" text-anchor="middle" class="small">Left branch: admin verification dialog before returning to main menu</text>
  <rect class="box" x="640" y="1600" width="520" height="48" opacity="0"/>
</svg>

